name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check gateway tests
      - run: PYTHONPATH=. pytest --cov=gateway --cov-fail-under=80

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: azure/setup-helm@v4.3.0
        with:
          version: 3.16.4
      - run: helm lint ./chart -f chart/values-local.yaml
      - run: helm template openai-llm-gateway ./chart -f chart/values-local.yaml > /tmp/helm.yaml
      - run: docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -ignore-missing-schemas -summary < /tmp/helm.yaml
      - run: find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -printf '/work/%p\0' | xargs -0 docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.7.0 -strict -ignore-missing-schemas -summary

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: openai-llm-gateway:ci

  kind-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.30.0
          node_image: kindest/node:v1.31.4
      - run: make kind-up
      - run: docker build -t openai-llm-gateway:local -f gateway/Dockerfile .
      - run: make kind-deploy-mock
      - run: make kind-test
      - if: always()
        run: make kind-down
