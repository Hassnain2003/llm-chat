# Local development overrides
# Usage: helm template llm-chat ./chart -f chart/values-local.yaml
#        helm upgrade --install llm-chat ./chart -f chart/values-local.yaml

model:
  backend: ollama
  name: tinyllama
  backendPort: 11434

gpu:
  enabled: false        # CPU only locally

gateway:
  image: llm-chat-gateway
  tag: latest
  replicas: 1           # single replica locally
  port: 8080
  rateLimit: 60         # requests per minute per client
  queueDepth: 20
  requestTimeout: 120

autoscaling:
  enabled: false        # no HPA locally

monitoring:
  enabled: false        # install separately with: make monitoring
