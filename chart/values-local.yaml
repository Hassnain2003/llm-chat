# Local development overrides
# Usage: helm template openai-llm-gateway ./chart -f chart/values-local.yaml
#        helm upgrade --install openai-llm-gateway ./chart -f chart/values-local.yaml

model:
  backend: ollama
  name: tinyllama
  backendPort: 11434

gpu:
  enabled: false        # CPU only locally

gateway:
  image: openai-llm-gateway
  tag: latest
  replicas: 1           # single replica locally
  port: 8080
  rateLimit: 60         # requests per minute per client
  queueDepth: 20
  requestTimeout: 120

autoscaling:
  enabled: false        # no HPA locally

monitoring:
  enabled: false        # install separately with: make monitoring
