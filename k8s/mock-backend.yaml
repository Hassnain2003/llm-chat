apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-chat-mock
  labels:
    app: llm-chat-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-chat-mock
  template:
    metadata:
      labels:
        app: llm-chat-mock
    spec:
      containers:
        - name: mock
          image: llm-chat-mock:ci
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: llm-chat-mock
spec:
  selector:
    app: llm-chat-mock
  ports:
    - port: 11434
      targetPort: 11434
