apiVersion: v1
kind: Service
metadata:
  name: openai-llm-gateway-model
  labels:
    app: openai-llm-gateway-model
spec:
  selector:
    app: openai-llm-gateway-model
  ports:
    - name: http
      port: 11434        # Ollama port (vLLM uses 8000 — set via configmap)
      targetPort: 11434
  type: ClusterIP        # Internal only — gateway is the public face
