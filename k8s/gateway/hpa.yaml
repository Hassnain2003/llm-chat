apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: openai-llm-gateway-gateway-hpa
  annotations:
    openai-llm-gateway.dev/status: optional-untested
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: openai-llm-gateway-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale on CPU as a baseline
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Optional, untested: requires Prometheus Adapter and the custom-metrics API.
    - type: Pods
      pods:
        metric:
          name: llm_chat_queue_depth
        target:
          type: AverageValue
          averageValue: "10"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
