apiVersion: v1
kind: Service
metadata:
  name: openai-llm-gateway-gateway
  labels:
    app: openai-llm-gateway-gateway
spec:
  selector:
    app: openai-llm-gateway-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: openai-llm-gateway-gateway-headless
spec:
  selector:
    app: openai-llm-gateway-gateway
  clusterIP: None
  ports:
    - port: 8080
