apiVersion: apps/v1
kind: Deployment
metadata:
  name: openai-llm-gateway-gateway
  labels:
    app: openai-llm-gateway-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openai-llm-gateway-gateway
  template:
    metadata:
      labels:
        app: openai-llm-gateway-gateway
        component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gateway
          image: openai-llm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: openai-llm-gateway-config
                  key: model_backend_url
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: openai-llm-gateway-config
                  key: model_name
            - name: BACKEND_TYPE
              valueFrom:
                configMapKeyRef:
                  name: openai-llm-gateway-config
                  key: backend_type
            - name: RATE_LIMIT_PER_MINUTE
              value: "60"
            - name: QUEUE_MAX_DEPTH
              value: "100"
            - name: REQUEST_TIMEOUT
              value: "120"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
